<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sharpen app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C8CDD2"/>
      <stop offset="0.55" stop-color="#F3EFE8"/>
      <stop offset="1" stop-color="#9aa0a6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- whetstone -->
  <rect x="96" y="330" width="320" height="40" rx="8" fill="#2a2a2a"/>
  <rect x="96" y="330" width="320" height="14" rx="7" fill="#3a3a3a"/>
  <!-- blade being sharpened: an upward chevron / mind-edge -->
  <path d="M256 96 L360 300 L256 250 L152 300 Z" fill="url(#blade)"/>
  <!-- orange spark at the edge (the single accent) -->
  <circle cx="256" cy="118" r="14" fill="#FF6A00"/>
  <path d="M256 96 L268 132 L256 124 L244 132 Z" fill="#FF8B4A"/>
  <!-- dither hint: small 1-bit specks rising from the stone -->
  <g fill="#FF6A00" opacity="0.55">
    <rect x="150" y="312" width="6" height="6"/>
    <rect x="360" y="316" width="6" height="6"/>
    <rect x="300" y="308" width="5" height="5"/>
    <rect x="206" y="318" width="5" height="5"/>
  </g>
</svg>
